clean_rooms:
  name: Clean rooms
  description: Start a room clean using Narwal's local clean/start_clean command.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    rooms:
      name: Rooms
      description: Narwal room IDs to clean, in order, or "all" for all current map rooms.
      required: true
      selector:
        object:
    mode:
      name: Mode
      default: vacuum_and_mop
      selector:
        select:
          options:
            - vacuum
            - mop
            - vacuum_then_mop
            - vacuum_and_mop
    suction:
      name: Suction
      default: standard
      selector:
        select:
          options:
            - ai
            - quiet
            - standard
            - strong
            - super_powerful
            - ultra_powerful
    water:
      name: Water
      default: normal
      selector:
        select:
          options:
            - dry
            - normal
            - wet
    mop_strength:
      name: Mop strength
      default: normal
      selector:
        select:
          options:
            - normal
            - high
    passes:
      name: Passes
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    route:
      name: Route
      selector:
        select:
          options:
            - standard
            - meticulous
    freo:
      name: Freo Mind
      description: Start a Freo Mind clean; the robot uses its stored Freo preset.
      default: false
      selector:
        boolean:

clean_zone:
  name: Clean zone
  description: Clean one rectangle (x1..y2) or several (zones) given in map grid cells (the robot must be docked).
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    zones:
      name: Zones
      description: List of rectangles [[x1, y1, x2, y2], ...] cleaned in order.
      example: "[[10, -24, 26, -8]]"
      selector:
        object:
    x1:
      name: X1
      selector:
        number:
          min: -2000
          max: 2000
          mode: box
    y1:
      name: Y1
      selector:
        number:
          min: -2000
          max: 2000
          mode: box
    x2:
      name: X2
      selector:
        number:
          min: -2000
          max: 2000
          mode: box
    y2:
      name: Y2
      selector:
        number:
          min: -2000
          max: 2000
          mode: box
    mode:
      name: Mode
      default: vacuum_and_mop
      selector:
        select:
          options: [vacuum, mop, vacuum_and_mop, vacuum_then_mop]
    suction:
      name: Suction
      default: standard
      selector:
        select:
          options: [quiet, standard, strong, super_powerful, max]
    water:
      name: Water
      default: normal
      selector:
        select:
          options: [dry, normal, wet]
    passes:
      name: Passes
      default: 1
      selector:
        number:
          min: 1
          max: 3
    freo:
      name: Freo Mind
      default: false
      selector:
        boolean:

go_to_point:
  name: Go to point
  description: Drive to a map point in grid cells (same frame as the robot pose).
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    x:
      name: X (cells)
      required: true
      selector:
        number:
          min: -1000
          max: 1000
          step: 0.1
          mode: box
    y:
      name: Y (cells)
      required: true
      selector:
        number:
          min: -1000
          max: 1000
          step: 0.1
          mode: box

remote_move:
  name: Remote move
  description: Enter remote control and drive for a short time. Speeds are -100..100. Use end to leave remote control (the robot returns to the dock).
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    linear:
      name: Linear speed
      default: 0
      selector:
        number:
          min: -100
          max: 100
    angular:
      name: Angular speed
      default: 0
      selector:
        number:
          min: -100
          max: 100
    duration:
      name: Duration (s)
      default: 1
      selector:
        number:
          min: 0.2
          max: 10
          step: 0.1
    mode:
      name: Mode
      default: joystick
      selector:
        select:
          options: [joystick, clean_default, sweep_mute, sweep_normal, sweep_strong, sweep_deep, sweep_super]
    end:
      name: End remote control afterwards
      default: false
      selector:
        boolean:

play_pet_voice:
  name: Play pet voice
  description: Play a clip stored on the robot. Get the paths with get_pet_voices.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    path:
      name: Robot path
      required: true
      example: /userdata/usr/data/voice/voiceO17.mp3
      selector:
        text:

get_pet_voices:
  name: Get pet voices
  description: List the dog and cat clips stored on the robot.
  target:
    entity:
      integration: narwal
      domain: vacuum

reset_consumables:
  name: Reset consumables
  description: Clear consumable alerts and reset their timers (ids from the consumable enums, e.g. replace 3 = side brush).
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    maintain:
      name: Maintenance item ids
      selector:
        object:
    replace:
      name: Replacement item ids
      selector:
        object:

add_no_go_zone:
  name: Add no-go zone
  description: Add a no-go, no-mop or no-sweep polygon. Points are map grid cells.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    polygon:
      name: Polygon
      required: true
      example: "[[58, 24], [73, 24], [73, 39], [58, 39]]"
      selector:
        object:
    zone_id:
      name: Zone id
      required: true
      selector:
        number:
          min: 1
          max: 999
          mode: box
    type:
      name: Type
      default: no_go
      selector:
        select:
          options: [no_go, no_mop, no_sweep]

add_room_ban:
  name: Ban room
  description: Forbid a whole room.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    room:
      name: Room
      required: true
      selector:
        text:
    zone_id:
      name: Zone id
      required: true
      selector:
        number:
          min: 1
          max: 999
          mode: box
    type:
      name: Type
      default: no_go
      selector:
        select:
          options: [no_go, no_mop, no_sweep]

remove_no_go_zone:
  name: Remove no-go zone
  description: Delete a no-go zone or room ban by id.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    zone_id:
      name: Zone id
      required: true
      selector:
        number:
          min: 1
          max: 999
          mode: box

update_room:
  name: Update room
  description: Rename a room, set its floor material or its heavily-soiled flag.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    room:
      name: Room
      required: true
      selector:
        text:
    name:
      name: New name
      selector:
        text:
    floor:
      name: Floor material
      selector:
        select:
          options: [wood, tile, cobblestone, tatami, marble]
    heavy_dirty:
      name: Heavily soiled
      selector:
        boolean:

set_map_name:
  name: Set map name
  description: Rename the active map (empty clears it).
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    name:
      name: Name
      required: true
      selector:
        text:

set_room_order:
  name: Set room order
  description: Custom cleaning order for the active map (room ids, names or areas, first to last).
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    order:
      name: Room order
      required: true
      selector:
        object:

add_carpet:
  name: Add carpet
  description: Draw a carpet polygon in map grid cells. Returns the carpet id the robot assigned.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    polygon:
      name: Polygon
      required: true
      example: "[[58, 24], [74, 24], [74, 40], [58, 40]]"
      selector:
        object:
    mode:
      name: Mode
      default: clean
      selector:
        select:
          options: [cross, clean, vacuum_and_mop, avoid]
    deep_clean:
      name: CarpetFocus deep clean
      default: false
      selector:
        boolean:

set_carpet_mode:
  name: Set carpet mode
  description: Change how one carpet is cleaned (ids are in the Map objects sensor).
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    carpet_id:
      name: Carpet id
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    mode:
      name: Mode
      required: true
      selector:
        select:
          options: [cross, clean, vacuum_and_mop, avoid]

delete_carpet:
  name: Delete carpet
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    carpet_id:
      name: Carpet id
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box

add_threshold:
  name: Add obstacle crossing line
  description: Enhanced obstacle crossing (threshold) line between two map points in grid cells. Returns its id.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    start:
      name: Start
      required: true
      example: "[58, 24]"
      selector:
        object:
    end:
      name: End
      required: true
      example: "[68, 24]"
      selector:
        object:
    height:
      name: Height (mm)
      default: 20
      selector:
        number:
          min: 1
          max: 60

delete_threshold:
  name: Delete obstacle crossing line
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    threshold_id:
      name: Line id
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box

update_furniture:
  name: Move furniture
  description: Move (centre in grid cells) or rotate (degrees) a furniture item on the map.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    furniture_id:
      name: Furniture id
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    x:
      name: X
      selector:
        number:
          min: -2000
          max: 2000
          step: 0.1
          mode: box
    y:
      name: Y
      selector:
        number:
          min: -2000
          max: 2000
          step: 0.1
          mode: box
    angle:
      name: Angle
      selector:
        number:
          min: 0
          max: 360
          mode: box

delete_furniture:
  name: Delete furniture
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    furniture_id:
      name: Furniture id
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box

rotate_map:
  name: Rotate map
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    angle:
      name: Angle
      required: true
      selector:
        select:
          options: ["0", "90", "180", "270"]

split_room:
  name: Split room
  description: Split a room along a line (grid cells). Creates a new room id, so update room-based automations and areas afterwards.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    room:
      name: Room
      required: true
      selector:
        text:
    start:
      name: Line start
      required: true
      selector:
        object:
    end:
      name: Line end
      required: true
      selector:
        object:

merge_rooms:
  name: Merge rooms
  description: Merge two adjacent rooms (the first keeps its id). Update room-based automations and areas afterwards.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    room_a:
      name: Room kept
      required: true
      selector:
        text:
    room_b:
      name: Room merged in
      required: true
      selector:
        text:

switch_map:
  name: Switch map
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    map_id:
      name: Map id
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box

delete_map:
  name: Delete map
  description: Permanently delete a saved map.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    map_id:
      name: Map id
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    confirm:
      name: Confirm deletion
      required: true
      selector:
        boolean:

start_mapping:
  name: Start mapping
  description: Start a mapping run (new map, or rebuild the current one). The robot leaves the dock.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    rebuild_current:
      name: Rebuild current map
      default: false
      selector:
        boolean:

continue_task:
  name: Continue interrupted task
  target:
    entity:
      integration: narwal
      domain: vacuum
